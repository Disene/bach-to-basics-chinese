# Bach to Basics: production-style Docker Compose
# Optional build-time Audiveris: set INSTALL_AUDIVERIS=1 in .env.
# See docs/AUDIVERIS.md. Legacy JAR mounting remains available.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_AUDIVERIS: ${INSTALL_AUDIVERIS:-0}
    container_name: bach-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
      - BACKEND_API_KEY=${BACKEND_API_KEY:-}
      - REQUIRE_AUTH=${REQUIRE_AUTH:-}
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN:-60}
      - HEAVY_RATE_LIMIT_PER_MIN=${HEAVY_RATE_LIMIT_PER_MIN:-10}
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-}
      - MUSIC21_TIMEOUT_S=${MUSIC21_TIMEOUT_S:-60}
      - AUDIVERIS_TIMEOUT_S=${AUDIVERIS_TIMEOUT_S:-120}
      - FINGERING_TIMEOUT_S=${FINGERING_TIMEOUT_S:-120}
    volumes:
      # Legacy standalone JAR only. The optional bundled installer uses /opt
      # and a PATH launcher, so this mount cannot hide its installation.
      - ./backend/bin:/app/bin:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: bach-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
